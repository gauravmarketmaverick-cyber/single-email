<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ellington & Vale</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="paper">

        <header class="header">

            <div class="brand">

                <img
                    src="assets/monogram/ev-monogram.png"
                    alt="EV Monogram"
                    class="monogram">

                <div class="brand-text">

                    <img
                        src="assets/wordmark/wordmark.png"
                        alt="Ellington & Vale"
                        class="wordmark">

                    <p class="tagline">
                        Strategic Advisory
                    </p>

                </div>

            </div>

            <div class="date">
                24 July 2026
            </div>

        </header>

        <section class="recipient">

            <p class="recipient-name">
                Mr. Jonathan Williams
            </p>

            <p>Williams Capital Partners</p>

            <p>London, United Kingdom</p>

        </section>

    </div>

</body>

</html>
